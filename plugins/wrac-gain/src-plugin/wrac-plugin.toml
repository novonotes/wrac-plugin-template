# Product-owned WRAC manifest for the example plugin.
#
# This file is the source of truth for host-visible metadata and wrapper
# descriptors. Build scripts and xtask read it through the `wrac_manifest` crate
# to generate CLAP/VST3/AU/AAX descriptors and decide the default build targets.
# Keep public IDs stable after release; changing them can break host project
# recall.
schema_version = 1

[bundle]
company_name = "Your Company"
auv2_manufacturer_code = "YrCo"
aax_manufacturer_id = "YrCo"
bundle_name = "WRAC Gain"
# macOS bundle IDs. Installers match installed bundles by these IDs, so keep
# them unchanged after release even if bundle_name changes.
# The CLAP bundle uses clap_bundle_identifier as is. VST3, AU, AAX, and the
# standalone app append format suffixes to wrapper_bundle_identifier.
clap_bundle_identifier = "com.your-company.wrac-gain"
wrapper_bundle_identifier = "com.your-company.wrac-gain"
# The executable inside each macOS bundle defaults to bundle_name. If you rename
# a released plugin, set macos_executable_name to the released executable name:
# macOS keeps a renamed AU hidden after an in-place update until the user logs out.
# macos_executable_name = "WRAC Gain"
homepage_url = "https://example.com/wrac-gain"
manual_url = "https://example.com/wrac-gain/manual"
support_url = "https://example.com/support"
description = "Simple gain plugin"
copyright = "Copyright 2026 Your Company"
formats = [
  { type = "clap", distribution = "public" },
  { type = "vst3", distribution = "public" },
  { type = "au", distribution = "public" },
  { type = "aax", distribution = "public" },
]

[[plugins]]
plugin_id = "com.your-company.wrac-gain"
plugin_name = "WRAC Gain"
clap_features = ["audio-effect", "utility", "stereo"]
vst3_subcategories = "Fx|Tools"
vst3_component_id = "822011ca-37ec-5cef-92d7-ec7e67207195"
standalone_name = "WRAC Gain Standalone"
auv2_type = "aufx"
auv2_subtype = "WtGn"
auv2_tags = ["Effects"]
aax_categories = ["effect"]
aax_product_id = "WtGn"
aax_stem_configs = [
  { name = "Mono", input = "mono", output = "mono", plugin_id = "WtGM" },
  { name = "Stereo", input = "stereo", output = "stereo", plugin_id = "WtGS" },
]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plugin</title>
    <!--
      Load the entry point as a Vite module script.
      In debug builds, the Vite dev server serves the .ts file directly.
      In release builds, it is compiled into a bundled JS file.
    -->
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <main class="panel">
        <div class="header">
          <button class="plugin-name" id="plugin-name" type="button"></button>
          <div class="header-actions">
            <button
              class="header-action header-settings"
              id="header-settings"
              type="button"
              aria-label="Show settings"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4L10.7 6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linejoin="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
              </svg>
            </button>
            <button
              class="header-action"
              id="header-action"
              type="button"
            ></button>
          </div>
        </div>
        <section class="page is-active" id="page-controls">
          <div class="meter">
            <button class="value" id="gain-db" type="button">0.0 dB</button>
            <input
              class="value value-input"
              id="gain-input"
              type="text"
              hidden
            />
          </div>
          <section class="knob-zone">
            <button
              class="knob"
              id="gain-knob"
              type="button"
              aria-label="Gain knob"
            >
              <div class="knob-track"></div>
              <div class="knob-indicator" id="knob-indicator"></div>
            </button>
          </section>
        </section>
        <section class="page settings-page" id="page-settings" hidden>
          <h1 class="settings-title">Settings</h1>
          <div class="settings-row">
            <label for="latency-select">Latency</label>
            <select class="latency-select" id="latency-select"></select>
          </div>
          <p class="settings-note">
            Delays the audio and reports the delay to the host as latency.
            Applied when the host reactivates the plugin.
          </p>
        </section>
        <section class="page about-page" id="page-about" hidden>
          <h1 class="about-title" id="about-title"></h1>
          <dl>
            <div>
              <dt>Plugin Name</dt>
              <dd id="about-plugin-name"></dd>
            </div>
            <div>
              <dt>Version</dt>
              <dd id="about-version"></dd>
            </div>
            <div>
              <dt>Company Name</dt>
              <dd id="about-company-name"></dd>
            </div>
            <div>
              <dt>Build</dt>
              <dd id="about-build"></dd>
            </div>
          </dl>
        </section>
      </main>
      <button
        class="resize-grip"
        id="resize-grip"
        type="button"
        aria-label="Resize plugin window"
      >
        <svg width="18" height="18" viewBox="0 0 12 12" aria-hidden="true">
          <path
            d="M2 10L10 2M5 10L10 5M8 10L10 8"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  </body>
</html>

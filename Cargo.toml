[workspace]
members = [
    "plugins/wrac-gain/src-plugin",
    "xtask",
    "crates/wrac_build",
    "crates/wrac_clap_adapter",
    "crates/wrac_host_context",
    "crates/wrac_log",
    "crates/wrac_manifest",
    "crates/xtask_workflow",
    "crates/wrac_build_ops",
    "crates/wrac_wxp_gui",
]
resolver = "2"

[workspace.dependencies]
clap-sys = "0.5.0"
# Update all wxp git dependencies from novonotes-internal, not main.
# Keep their revisions aligned with consuming workspaces to avoid duplicate WebView types and run loops.
novonotes_run_loop = { git = "https://github.com/novonotes/wxp.git", package = "novonotes_run_loop", rev = "de6975a0c9e06f21c3f77fe9ce32c47b252756ce" }
run_loop_timer = { git = "https://github.com/novonotes/wxp.git", package = "run_loop_timer", rev = "de6975a0c9e06f21c3f77fe9ce32c47b252756ce" }
wrac_clap_adapter = { path = "crates/wrac_clap_adapter" }
wrac_build_ops = { path = "crates/wrac_build_ops" }
wrac_manifest = { path = "crates/wrac_manifest" }
wrac_host_context = { path = "crates/wrac_host_context" }
wrac_log = { path = "crates/wrac_log" }
wrac_wxp_gui = { path = "crates/wrac_wxp_gui" }
xtask_workflow = { path = "crates/xtask_workflow" }
wxp = { git = "https://github.com/novonotes/wxp.git", rev = "de6975a0c9e06f21c3f77fe9ce32c47b252756ce" }

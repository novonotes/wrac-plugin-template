[workspace]
members = [
    "plugins/wrac-gain/src-plugin",
    "xtask",
    "crates/wrac_build",
    "crates/wrac_clap_adapter",
    "crates/wrac_host_context",
    "crates/wrac_log",
    "crates/wrac_manifest",
    "crates/xtask_workflow",
    "crates/wrac_build_ops",
    "crates/wrac_wxp_gui",
]
resolver = "2"

[workspace.dependencies]
clap-sys = "0.5.0"
novonotes_run_loop = { git = "https://github.com/novonotes/wxp.git", package = "novonotes_run_loop", rev = "c44e90c66a4f3c1ff8a0fec8d17dd20e7a41dc69" }
run_loop_timer = { git = "https://github.com/novonotes/wxp.git", package = "run_loop_timer", rev = "c44e90c66a4f3c1ff8a0fec8d17dd20e7a41dc69" }
wrac_clap_adapter = { path = "crates/wrac_clap_adapter" }
wrac_build_ops = { path = "crates/wrac_build_ops" }
wrac_manifest = { path = "crates/wrac_manifest" }
wrac_host_context = { path = "crates/wrac_host_context" }
wrac_log = { path = "crates/wrac_log" }
wrac_wxp_gui = { path = "crates/wrac_wxp_gui" }
xtask_workflow = { path = "crates/xtask_workflow" }
wxp = { git = "https://github.com/novonotes/wxp.git", rev = "c44e90c66a4f3c1ff8a0fec8d17dd20e7a41dc69" }
